[package]
name = "otozane-service"
description = "Otozane background audio service"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "otozaned"
path = "src/main.rs"

[dependencies]
otozane-core.workspace = true
serde_json.workspace = true
toml.workspace = true
otozane-plugins = { path = "../otozane-plugins" }
serde.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
otozane-pipewire.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
otozane-coreaudio = { path = "../otozane-coreaudio" }
