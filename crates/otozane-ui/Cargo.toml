[package]
name = "otozane-ui"
description = "Otozane desktop interface"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "otozane"
path = "src/main.rs"

[dependencies]
otozane-core.workspace = true
serde.workspace = true
toml.workspace = true
eframe = { version = "0.37", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
egui = "0.37"
rfd = "0.18"
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
