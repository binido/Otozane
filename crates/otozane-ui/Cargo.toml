[package]
name = "otozane-ui"
description = "Otozane desktop interface"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "otozane"
path = "src/main.rs"

[dependencies]
otozane-core.workspace = true
serde.workspace = true
toml.workspace = true
eframe = { version = "0.37", default-features = false, features = ["default_fonts"] }
egui = "0.37"
rfd = "0.18"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "wayland", "x11"] }
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }

# Metal through wgpu, OpenGL on macOS is deprecated.
[target.'cfg(target_os = "macos")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu"] }
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSResponder", "NSRunningApplication", "NSWindow"] }
tray-icon = "0.26.1"
